name: Deploy

# Manual for now: enable `push: branches: [main]` once the secrets below exist.
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: |
          pnpm exec supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          pnpm exec supabase db push

      - name: Build board
        run: pnpm --filter @pann/board build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      # Worker secrets (SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY) are set once
      # with `wrangler secret put`, not from CI.
      - name: Deploy Worker (API + board assets)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
