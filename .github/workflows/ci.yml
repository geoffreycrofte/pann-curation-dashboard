name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pann/board build
      - run: pnpm --filter @pann/api build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Supabase CLI of the lockfile, as in the Deploy workflow: no lookup of the
      # "latest" release through the GitHub API, which is rate limited.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and seed on a local stack
        run: |
          pnpm exec supabase db start
          pnpm exec supabase db reset
          pnpm exec supabase db lint --level error
